<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 340px; background: #0a0c12; color: #e8eaf2;
           font-family: sans-serif; padding: 16px; }
    h2 { color: #00e5ff; font-size: 14px; margin-bottom: 12px;
         letter-spacing: 2px; }
    textarea { width: 100%; background: #1e2235; color: #e8eaf2;
               border: 1px solid #2a3050; border-radius: 6px;
               padding: 8px; font-size: 13px; resize: none; }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1; border: none; border-radius: 6px;
             padding: 8px; cursor: pointer; font-weight: bold;
             font-size: 12px; transition: opacity 0.2s; }
    button:hover { opacity: 0.85; }
    #translateBtn { background: #00e5ff; color: #0a0c12; }
    #speakOrigBtn { background: #1e2235; color: #00ff9d;
                    border: 1px solid #00ff9d; }
    #speakBtn { background: #00ff9d; color: #0a0c12; }
    #copyBtn { background: #1e2235; color: #ffab40;
               border: 1px solid #ffab40; }
    #result { margin-top: 12px; padding: 10px; background: #1e2235;
              border-radius: 6px; border-left: 3px solid #00e5ff;
              font-size: 14px; display: none; line-height: 1.8;
              font-family: 'Khmer OS', 'Hanuman', sans-serif; }
    #status { font-size: 11px; color: #9da5c0; margin-top: 8px;
              text-align: center; min-height: 16px; }
    .lang-row { display: flex; gap: 8px; margin-bottom: 10px;
                align-items: flex-end; }
    select { flex: 1; background: #1e2235; color: #e8eaf2;
             border: 1px solid #2a3050; border-radius: 6px;
             padding: 6px; font-size: 12px; }
    label { font-size: 11px; color: #9da5c0; display: block;
            margin-bottom: 4px; }
    .arrow { color: #2a3050; font-size: 18px; padding-bottom: 4px; }
    .section-label { font-size: 10px; color: #5c6480;
                     letter-spacing: 2px; margin: 12px 0 6px;
                     text-transform: uppercase; }
    .khmer-note { font-size: 11px; color: #ffab40;
                  background: rgba(255,171,64,0.08);
                  border: 1px solid rgba(255,171,64,0.2);
                  border-radius: 6px; padding: 6px 10px;
                  margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <h2>⚡ LEXIFLOW 🇰🇭</h2>

  <div class="lang-row">
    <div style="flex:1">
      <label>FROM</label>
      <select id="sourceLang">
        <option value="auto">Auto Detect</option>
        <option value="km">🇰🇭 ខ្មែរ (Khmer)</option>
        <option value="en">🇺🇸 English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="zh">Chinese</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="th">Thai</option>
      </select>
    </div>
    <div class="arrow">→</div>
    <div style="flex:1">
      <label>TO</label>
      <select id="targetLang">
        <option value="en">🇺🇸 English</option>
        <option value="km">🇰🇭 ខ្មែរ (Khmer)</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="zh">Chinese</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="th">Thai</option>
      </select>
    </div>
  </div>

  <textarea id="input" rows="3"
    placeholder="វាយអត្ថបទខ្មែរ ឬ English នៅទីនេះ..."></textarea>

  <div class="btn-row">
    <button id="translateBtn" onclick="translate()">
      🔄 Translate
    </button>
  </div>

  <div id="result"></div>

  <div class="btn-row" style="margin-top:8px; display:none"
       id="actionBtns">
    <button id="speakOrigBtn" onclick="speakOriginal()">
      🔊 Read Original
    </button>
    <button id="speakBtn" onclick="speakTranslation()">
      🔊 Read Translation
    </button>
    <button id="copyBtn" onclick="copyResult()">
      📋 Copy
    </button>
  </div>

  <div class="khmer-note" id="khmerNote">
    💡 Khmer voice may use Google Translate TTS for best quality
  </div>

  <div id="status"></div>

  <script>
    let lastTranslation = '';
    let lastOriginal = '';
    let speakingWhat = '';

    async function translate() {
      const text = document.getElementById('input').value.trim();
      const target = document.getElementById('targetLang').value;
      const source = document.getElementById('sourceLang').value;
      const status = document.getElementById('status');
      const result = document.getElementById('result');
      const actionBtns = document.getElementById('actionBtns');

      if (!text) {
        status.textContent = '⚠️ Please enter some text first!';
        return;
      }

      status.textContent = '⏳ Translating...';
      result.style.display = 'none';
      actionBtns.style.display = 'none';

      try {
        const r = await fetch(
          `http://localhost:8000/translate?text=${encodeURIComponent(text)}&target=${target}&source=${source}`
        );
        const d = await r.json();
        lastTranslation = d.translation;
        lastOriginal = text;

        result.style.display = 'block';
        result.innerHTML = `
          <div style="font-size:11px;color:#5c6480;margin-bottom:6px">
            TRANSLATION
          </div>
          ${lastTranslation}
        `;

        actionBtns.style.display = 'flex';

        const hasKhmer = target === 'km' || source === 'km';
        document.getElementById('khmerNote').style.display =
          hasKhmer ? 'block' : 'none';

        status.textContent = '✅ Done! Click 🔊 to hear it.';
      } catch {
        status.textContent = '❌ Error: Make sure API is running on port 8000!';
      }
    }

    function speakTranslation() {
      const lang = document.getElementById('targetLang').value;
      speakText(lastTranslation, lang, 'speakBtn', '🔊 Read Translation');
    }

    function speakOriginal() {
      const lang = document.getElementById('sourceLang').value;
      speakText(lastOriginal, lang, 'speakOrigBtn', '🔊 Read Original');
    }

    function speakText(text, lang, btnId, originalLabel) {
      if (!text) return;
      const btn = document.getElementById(btnId);
      const status = document.getElementById('status');

      if (speakingWhat === btnId) {
        window.speechSynthesis.cancel();
        speakingWhat = '';
        btn.textContent = originalLabel;
        return;
      }

      window.speechSynthesis.cancel();
      speakingWhat = btnId;
      btn.textContent = '⏹ Stop';

      const langCode = getLangCode(lang);

      if (lang === 'km') {
        speakKhmer(text, btn, originalLabel);
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = langCode;
      utterance.rate = 0.85;
      utterance.pitch = 1;
      utterance.volume = 1;

      const voices = window.speechSynthesis.getVoices();
      const match = voices.find(v =>
        v.lang.startsWith(lang) || v.lang === langCode
      );
      if (match) utterance.voice = match;

      utterance.onend = () => {
        speakingWhat = '';
        btn.textContent = originalLabel;
        status.textContent = '🔊 Finished reading!';
      };

      utterance.onerror = () => {
        speakingWhat = '';
        btn.textContent = originalLabel;
        status.textContent = '❌ Voice not available for this language';
      };

      window.speechSynthesis.speak(utterance);
      status.textContent = '🔊 Reading...';
    }

    function speakKhmer(text, btn, originalLabel) {
      const status = document.getElementById('status');
      const audio = new Audio(
        `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=km&client=tw-ob`
      );

      audio.onplay = () => {
        status.textContent = '🔊 Reading Khmer...';
      };

      audio.onended = () => {
        speakingWhat = '';
        btn.textContent = originalLabel;
        status.textContent = '🔊 Finished reading Khmer!';
      };

      audio.onerror = () => {
        status.textContent = '⚠️ Trying system voice for Khmer...';
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'km-KH';
        utterance.rate = 0.8;
        utterance.onend = () => {
          speakingWhat = '';
          btn.textContent = originalLabel;
        };
        window.speechSynthesis.speak(utterance);
      };

      audio.play().catch(() => {
        status.textContent = '⚠️ Using system voice...';
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'km-KH';
        utterance.rate = 0.8;
        utterance.onend = () => {
          speakingWhat = '';
          btn.textContent = originalLabel;
        };
        window.speechSynthesis.speak(utterance);
      });
    }

    function copyResult() {
      if (!lastTranslation) return;
      navigator.clipboard.writeText(lastTranslation).then(() => {
        document.getElementById('status').textContent =
          '📋 Copied to clipboard!';
        document.getElementById('copyBtn').textContent = '✅ Copied!';
        setTimeout(() => {
          document.getElementById('copyBtn').textContent = '📋 Copy';
        }, 2000);
      });
    }

    function getLangCode(lang) {
      const codes = {
        'km': 'km-KH',
        'en': 'en-US',
        'es': 'es-ES',
        'fr': 'fr-FR',
        'de': 'de-DE',
        'zh': 'zh-CN',
        'ja': 'ja-JP',
        'ko': 'ko-KR',
        'th': 'th-TH',
        'auto': 'en-US'
      };
      return codes[lang] || 'en-US';
    }

    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.getVoices();
    };

    document.getElementById('input')
      .addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.ctrlKey) translate();
      });
  </script>
</body>
</html>
